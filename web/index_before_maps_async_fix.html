<!DOCTYPE html>
<html>
<head>
  <base href="/" />

  <meta charset="UTF-8">
  <meta name="description" content="PrimeX Marketplace">

  <title>PrimeX</title>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBklZHVAXMKjHBGvSZo5PICJUbT0tSQxo8&libraries=places"></script>
  <script src="flutter.js" defer></script>
</head>

<body>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: { serviceWorkerVersion: null },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
