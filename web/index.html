<!DOCTYPE html>
<html>
<head>
<link rel="icon" type="image/png" href="favicon.png"/>
  <base href="/" />

  <meta charset="UTF-8">
  <meta name="description" content="PrimeX Marketplace">

  <title>PrimeX</title>

  <script src="https://maps.googleapis.com/maps/api/js?loading=async&key=AIzaSyBklZHVAXMKjHBGvSZo5PICJUbT0tSQxo8&libraries=places"></script>
  <script src="flutter.js" defer></script>

<script>
(async function primeXCacheReset() {
  const version = "primex-map-unified-v2";

  if (localStorage.getItem("primex_cache_version") === version) {
    return;
  }

  try {
    if ("serviceWorker" in navigator) {
      const registrations =
          await navigator.serviceWorker.getRegistrations();

      for (const registration of registrations) {
        await registration.unregister();
      }
    }

    if ("caches" in window) {
      const cacheNames = await caches.keys();

      await Promise.all(
        cacheNames.map((cacheName) => caches.delete(cacheName))
      );
    }

    localStorage.setItem("primex_cache_version", version);

    window.location.reload(true);
  } catch (error) {
    console.error("PrimeX cache reset failed:", error);
  }
})();
</script>

</head>

<body>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: { serviceWorkerVersion: null },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
